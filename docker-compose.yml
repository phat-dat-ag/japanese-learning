services:
  mysql:
    image: mysql:8.4
    container_name: jp_mysql_vocabulary
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-japanese_learning}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:-japanese_learning}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  flyway-vocabulary:
    image: flyway/flyway:latest
    container_name: jp_flyway_vocabulary
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-japanese_learning}
      FLYWAY_USER: ${MYSQL_USER:-japanese_learning}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      FLYWAY_CONNECT_RETRIES: "60"
    command: ["migrate"]
    volumes:
      - ${QUARKUS_MIGRATION_PATH:-./quarkus/src/main/resources/db/migration}:/flyway/sql:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jp_sqlserver_user
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$${MSSQL_SA_PASSWORD}\" /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -C -b -l 3 -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # SQL Server does not create the application database from an environment variable.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: ["-S", "sqlserver,1433", "-U", "sa", "-C", "-b", "-Q", "IF DB_ID(N'JapaneseLearningUser') IS NULL CREATE DATABASE [JapaneseLearningUser];"]

  flyway-user:
    image: flyway/flyway:latest
    container_name: japanese-learning-user-flyway
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      FLYWAY_URL: jdbc:sqlserver://sqlserver:1433;databaseName=JapaneseLearningUser;encrypt=false;trustServerCertificate=true
      FLYWAY_USER: sa
      FLYWAY_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      FLYWAY_CONNECT_RETRIES: "60"
    command: ["migrate"]
    volumes:
      - ${DOTNET_MIGRATION_PATH:-./dotnet/db/migration}:/flyway/sql:ro

  user-api:
    build:
      context: ./dotnet
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      flyway-user:
        condition: service_completed_successfully
    environment:
      Database__ConnectionString: "Server=sqlserver,1433;Database=JapaneseLearningUser;User Id=sa;Password='${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}';TrustServerCertificate=True"
      Jwt__Issuer: ${JWT_ISSUER:-JapaneseLearning.User}
      Jwt__Audience: ${JWT_AUDIENCE:-JapaneseLearning}
      Jwt__PrivateKeyPath: /app/secrets/jwt/private.pem
      Jwt__PublicKeyPath: /app/secrets/jwt/public.pem
      Jwt__KeyId: ${JWT_KEY_ID:-japanese-learning-local-1}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
    ports:
      - "8081:8080"
    volumes:
      - type: bind
        source: ./secrets/jwt/private.pem
        target: /app/secrets/jwt/private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/jwt/public.pem
        target: /app/secrets/jwt/public.pem
        read_only: true
        bind:
          create_host_path: false

  vocabulary-api:
    build:
      context: ./quarkus
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      flyway-vocabulary:
        condition: service_completed_successfully
      # No HTTP probe tool in .NET; Quarkus retries initial JWKS access.
      user-api:
        condition: service_started
    environment:
      DB_USERNAME: ${MYSQL_USER:-japanese_learning}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_REACTIVE_URL: mysql://mysql:3306/${MYSQL_DATABASE:-japanese_learning}
      AUTH_SERVER_URL: http://user-api:8080
      AUTH_JWKS_URL: http://user-api:8080/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-JapaneseLearning.User}
      AUTH_JWT_AUDIENCE: ${JWT_AUDIENCE:-JapaneseLearning}
      QUARKUS_OIDC_CONNECTION_DELAY: 60S
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      user-api:
        condition: service_started
      vocabulary-api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: ./gateway/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mysql_data:
  sqlserver_data:
