# Order: base, production, observability, production-observability.
services:
  prometheus:
    networks: !override [api, monitoring]
    ports: !reset []
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
  grafana:
    networks: !override [monitoring, monitoring-access]
    # Host access stays on loopback; GRAFANA_HOST_PORT selects the port.
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
networks:
  monitoring:
    internal: true
  monitoring-access:
