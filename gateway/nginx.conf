worker_processes auto;
worker_shutdown_timeout 65s;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # All mutable gateway files stay in its bounded tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # One bounded, log-safe ID across the edge and direct backend requests.
    map $http_x_correlation_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9_-]{1,64}$" $http_x_correlation_id;
    }

    # Keep OPTIONS for the Angular dev proxy and future explicit CORS handling.
    # An empty value suppresses the gateway's Allow header on ordinary responses.
    map $request_method $gateway_allow {
        default "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS";
        ~^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ "";
    }

    # Empty keys are not counted. Never derive identity from client-supplied headers.
    map "$request_method:$uri" $api_limit_key {
        default $binary_remote_addr;
        ~^OPTIONS: "";
        ~^[^:]+:/health$ "";
    }

    # Use normalized URIs and case-insensitive suffixes for ASP.NET route matching.
    # These budgets are shared across spelling variants, query strings, and methods.
    map $uri $auth_limit_key {
        default "";
        ~*^/api/auth/(?:login|register)(?:/|$) $api_limit_key;
    }
    map $uri $refresh_limit_key {
        default "";
        ~*^/api/auth/refresh(?:/|$) $api_limit_key;
    }
    map $uri $import_limit_key {
        default "";
        ~*^/api/vocabularies/import(?:/|$) $api_limit_key;
    }
    # OPTIONS skips rate budgets, but still consumes a normal active-request slot.
    map $uri $client_connection_key {
        /health "";
        default $binary_remote_addr;
    }
    map $client_connection_key $gateway_connection_key {
        "" "";
        default api;
    }
    map $import_limit_key $import_connection_key {
        "" "";
        default import;
    }

    # Bounded shared memory, shared by all workers in this gateway instance.
    limit_req_zone $api_limit_key zone=api_requests:10m rate=20r/s;
    limit_req_zone $auth_limit_key zone=auth_attempts:10m rate=10r/m;
    limit_req_zone $refresh_limit_key zone=token_refresh:10m rate=60r/m;
    limit_req_zone $import_limit_key zone=vocabulary_import:10m rate=2r/m;
    limit_conn_zone $client_connection_key zone=client_connections:10m;
    limit_conn_zone $gateway_connection_key zone=gateway_connections:1m;
    limit_conn_zone $import_connection_key zone=import_connections:1m;

    # Log route families, never arbitrary paths or query strings containing secrets.
    map $uri $log_route {
        default unmatched;
        ~^/api/auth(?:/|$) auth;
        ~^/api/v1/(?:flashcards|jlpt-levels|lessons)(?:/|$) vocabulary;
        ~^/api/vocabularies(?:/|$) import;
        /health health;
    }

    # Exclude request lines, bodies, and headers that could contain credentials.
    log_format gateway '$remote_addr [$time_local] route=$log_route '
                       '$status $body_bytes_sent $request_time upstream_status=$upstream_status '
                       'correlationId=$correlation_id rate=$limit_req_status connections=$limit_conn_status';
    access_log /dev/stdout gateway;

    # Docker's embedded DNS; refresh upstream IPs when containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream user_backend {
        zone user_backend 64k;
        server user-api:8080 resolve;
    }

    upstream vocabulary_backend {
        zone vocabulary_backend 64k;
        server vocabulary-api:8080 resolve;
    }

    server {
        listen 8080;
        server_name _;
        # Raw request error messages can include URLs/headers. Keep sanitized access
        # logs (including upstream status) and global startup/configuration errors.
        error_log /dev/null;

        client_max_body_size 10m;
        client_header_timeout 10s;
        client_body_timeout 30s;
        send_timeout 30s;
        keepalive_timeout 30s;
        large_client_header_buffers 4 8k;
        ignore_invalid_headers on;
        underscores_in_headers off;

        # Inherited by every proxy location. Keep all limit_req/limit_conn directives
        # here: defining one in a child location replaces that family's inheritance.
        # nodelay permits short bursts without retaining a delayed-request queue.
        limit_req zone=api_requests burst=40 nodelay;
        limit_req zone=auth_attempts burst=5 nodelay;
        limit_req zone=token_refresh burst=10 nodelay;
        limit_req zone=vocabulary_import burst=1 nodelay;
        limit_req_status 429;
        limit_conn client_connections 20;
        limit_conn gateway_connections 200;
        limit_conn import_connections 2;
        limit_conn_status 429;

        # Return-only rewrite: disallow TRACE/WebDAV/unknown methods without
        # changing route-specific method handling in the application services.
        if ($gateway_allow != "") {
            return 405;
        }

        # These responses are API data or gateway errors, not the Angular document.
        # Keep all add_header directives together so locations inherit them.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Allow $gateway_allow always;
        add_header X-Correlation-ID $correlation_id always;

        proxy_connect_timeout 5s;
        # Retain the existing 60-second upstream inactivity window for imports.
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        proxy_cache off;
        # No replicas/failover today; never replay an authentication or import call.
        proxy_next_upstream off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # No WebSocket, trailer, or forward-proxy functionality on these API routes.
        proxy_set_header Upgrade "";
        proxy_set_header TE "";
        proxy_set_header Trailer "";
        proxy_set_header Proxy "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_hide_header X-Correlation-ID;
        # Server is already hidden by the proxy module; server_tokens hides our version.
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the edge proxy: discard client-supplied forwarding chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # No URI suffix on proxy_pass: preserve paths and query parameters.
        location ~ ^/api/auth(?:/|$) {
            proxy_pass http://user_backend;
        }

        location ~ ^/api/v1/(?:flashcards|jlpt-levels|lessons)(?:/|$) {
            proxy_pass http://vocabulary_backend;
        }

        location ~ ^/api/vocabularies(?:/|$) {
            proxy_pass http://vocabulary_backend;
        }

        # Backend health, JWKS, and other infrastructure routes stay internal/debug-only.
        location / {
            return 404;
        }
    }
}
