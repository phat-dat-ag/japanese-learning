user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Exclude query strings, bodies, and headers that could contain credentials.
    log_format gateway '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log gateway;

    # Docker's embedded DNS; refresh upstream IPs when containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream user_backend {
        zone user_backend 64k;
        server user-api:8080 resolve;
    }

    upstream vocabulary_backend {
        zone vocabulary_backend 64k;
        server vocabulary-api:8080 resolve;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the edge proxy: discard client-supplied forwarding chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # No URI suffix on proxy_pass: preserve paths and query parameters.
        location ~ ^/api/auth(?:/|$) {
            proxy_pass http://user_backend;
        }

        location ~ ^/api/v1/(?:flashcards|jlpt-levels|lessons)(?:/|$) {
            proxy_pass http://vocabulary_backend;
        }

        location ~ ^/api/vocabularies(?:/|$) {
            proxy_pass http://vocabulary_backend;
        }

        # Backend health, JWKS, and other infrastructure routes stay internal/debug-only.
        location / {
            return 404;
        }
    }
}
