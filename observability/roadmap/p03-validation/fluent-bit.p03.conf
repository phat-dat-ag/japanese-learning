# INACTIVE isolated profile; never mount existing state/log volumes.
[SERVICE]
    Flush                     2
    Grace                     30
    Log_Level                 warn
    Parsers_File              /p03/parsers-app.conf
    storage.path              /p03-state/buffer
    storage.sync              full
    storage.checksum          on
    storage.backlog.mem_limit 8M
    storage.max_chunks_up     32
    storage.metrics           On
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On

[INPUT]
    Name              tail
    Tag               apps.jwks-api
    Path              /logs/jwks/*.log
    Parser            application_json
    DB                /p03-state/jwks.db
    DB.Sync           Full
    Read_from_Head    On
    Refresh_Interval  2
    Rotate_Wait       30
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               apps.user-api
    Path              /logs/user/user-api-*.json
    Parser            application_json
    DB                /p03-state/user.db
    DB.Sync           Full
    Read_from_Head    On
    Refresh_Interval  2
    Rotate_Wait       30
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               apps.vocabulary-api
    Path              /logs/vocabulary/application.json.log
    Parser            application_json
    DB                /p03-state/vocabulary.db
    DB.Sync           Full
    Read_from_Head    On
    Refresh_Interval  2
    Rotate_Wait       30
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name          lua
    Match         apps.*
    script        /p03/normalize.p03.lua
    call          normalize
    type_int_key  http_status
    time_as_table On
    protected_mode On

[OUTPUT]
    Name                     opensearch
    Match                    apps.*
    Host                     p03-opensearch
    Port                     9200
    Suppress_Type_Name       On
    Logstash_Format          On
    Logstash_Prefix          application-logs
    Logstash_Prefix_Key      $index_prefix
    Current_Time_Index       On
    Time_Key                 collected_at
    Generate_ID              On
    Write_Operation          index
    Retry_Limit              False
    storage.total_limit_size 64M
    Trace_Error              Off
