quarkus.application.name=${APP_SERVICE_NAME:quarkus-service}

# Database
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

# Reactive datasource
quarkus.datasource.reactive.url=${DB_REACTIVE_URL}

# Hibernate Reactive
quarkus.hibernate-orm.schema-management.strategy=none

# Ignore null value in response
quarkus.jackson.serialization-inclusion=non-null

# Independent JWKS: JWT resource server only (no discovery or introspection).
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${AUTH_SERVER_URL:http://localhost:8083}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=${AUTH_JWKS_URL:${quarkus.oidc.auth-server-url}/api/v1/jwks/user}
quarkus.oidc.token.issuer=${AUTH_JWT_ISSUER:JapaneseLearning.User}
quarkus.oidc.token.audience=${AUTH_JWT_AUDIENCE:JapaneseLearning}
quarkus.oidc.token.signature-algorithm=RS256
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.principal-claim=sub

# The .NET token contract has exp but deliberately does not emit iat.
quarkus.oidc.token.issued-at-required=false
quarkus.oidc.token.lifespan-grace=0
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.oidc.roles.role-claim-path=role
quarkus.oidc.jwks.resolve-early=false
quarkus.oidc.jwks.cache-time-to-live=${AUTH_JWKS_CACHE_TTL:10M}
quarkus.oidc.devservices.enabled=false

# OidcProvider verification warnings can include the complete rejected bearer token.
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR

# Default authorization for application REST resources; explicit annotations override it.
quarkus.security.jaxrs.default-roles-allowed=User,Admin

# Swagger accepts a raw access token and supplies the Bearer prefix.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.jwt-security-scheme-value=bearer
quarkus.smallrye-openapi.jwt-bearer-format=JWT
quarkus.smallrye-openapi.security-scheme-description=Paste the raw JWT access token issued by the Auth Service
quarkus.smallrye-openapi.auto-add-security=false

# All application operations inherit the global requirement in META-INF/openapi.yaml.
quarkus.smallrye-openapi.auto-add-security-requirement=false

# Admin contracts are fully defined in the static document; annotation scanning would overwrite them.
mp.openapi.scan.exclude.packages=com.japaneselearning.vocabulary.admin

# Include the request context in existing JBoss application logging.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) correlationId=%X{correlationId} %s%e%n

# The built-in endpoint validator rethrows return-value failures outside REST exception mapping.
# Our mapper keeps input errors at 400 and emits safe, correlated 500s for invalid server output.
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.hibernate.validator.runtime.jaxrs.ResteasyReactiveViolationExceptionMapper

# Metrics stay on the existing internal/localhost API listener; the Gateway does not route /q.
# Opt in only to HTTP and runtime binders; no client URLs, DB labels or arbitrary extensions.
quarkus.micrometer.binder-enabled-default=false
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.vertx.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.ignore-patterns=/q/.*
quarkus.micrometer.binder.http-server.max-uri-tags=32

# Normalize before registry lookup too, so early auth failures cannot fill URI caches.
# These patterns are mutually exclusive; their evaluation order does not matter.
quarkus.micrometer.binder.http-server.match-patterns=^/api/v1/flashcards(?:/.*)?$=/api/v1/flashcards,^/api/v1/jlpt-levels(?:/.*)?$=/api/v1/jlpt-levels,^/api/v1/lessons(?:/.*)?$=/api/v1/lessons,^/api/vocabularies/import$=/api/vocabularies/import,^(?!/api/v1/(?:flashcards|jlpt-levels|lessons)(?:/|$)|/api/vocabularies/import$).*=/other

# Bound each synchronous import transaction; override for larger curated imports.
vocabulary.import.max-batch-size=${VOCABULARY_IMPORT_MAX_BATCH_SIZE:500}

# Application-wide handlers; retain console output for Docker collectors.
quarkus.log.level=${ROOT_LOG_LEVEL:INFO}
quarkus.log.category."com.japaneselearning".level=${APP_LOG_LEVEL:INFO}
quarkus.log.console.enabled=true
quarkus.log.console.async.enabled=true
quarkus.log.console.async.queue-length=8192
quarkus.log.console.async.overflow=discard
quarkus.log.file.enabled=${APP_LOG_FILE_ENABLED:true}
quarkus.log.file.path=${APP_LOG_DIR:logs}/${APP_LOG_FILE:application.json.log}
quarkus.log.file.encoding=UTF-8
quarkus.log.file.format=${quarkus.log.console.format}
quarkus.log.file.async.enabled=true
quarkus.log.file.async.queue-length=8192
quarkus.log.file.async.overflow=discard
# Daily + size rotation; per-day backup cap can shorten time-based retention under heavy load.
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd.gz
quarkus.log.file.rotation.max-file-size=${APP_LOG_ROTATION_SIZE:50M}
quarkus.log.file.rotation.max-backup-index=${APP_LOG_MAX_BACKUPS:100}
quarkus.log.file.rotation.rotate-on-boot=false
application.logging.retention-days=${APP_LOG_RETENTION_DAYS:30}
%test.quarkus.log.file.enabled=false

# Official JSON formatter: one object per line; event fields are typed by ApplicationJsonFields.
application.logging.environment=${APP_ENVIRONMENT:production}
%dev.application.logging.environment=${APP_ENVIRONMENT:development}
%test.application.logging.environment=${APP_ENVIRONMENT:test}
application.logging.slow-operation-ms=${APP_SLOW_OPERATION_MS:1000}
quarkus.log.console.json.enabled=${APP_LOG_CONSOLE_JSON:true}
quarkus.log.file.json.enabled=${APP_LOG_FILE_JSON:true}
quarkus.log.console.json.pretty-print=false
quarkus.log.file.json.pretty-print=false
quarkus.log.console.json.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
quarkus.log.file.json.date-format=${quarkus.log.console.json.date-format}
quarkus.log.console.json.zone-id=UTC
quarkus.log.file.json.zone-id=UTC
quarkus.log.console.json.key-overrides=timestamp=@timestamp,logger-name=logger.name,thread-name=thread.name
quarkus.log.file.json.key-overrides=${quarkus.log.console.json.key-overrides}
quarkus.log.console.json.excluded-keys=mdc,ndc
quarkus.log.file.json.excluded-keys=${quarkus.log.console.json.excluded-keys}
quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name}
quarkus.log.console.json.additional-field."service.version".value=${quarkus.application.version}
quarkus.log.console.json.additional-field."service.instance.id".value=${APP_INSTANCE_ID:${HOSTNAME:unknown}}
quarkus.log.console.json.additional-field."deployment.environment".value=${application.logging.environment}
quarkus.log.file.json.additional-field."service.name".value=${quarkus.application.name}
quarkus.log.file.json.additional-field."service.version".value=${quarkus.application.version}
quarkus.log.file.json.additional-field."service.instance.id".value=${APP_INSTANCE_ID:${HOSTNAME:unknown}}
quarkus.log.file.json.additional-field."deployment.environment".value=${application.logging.environment}
quarkus.banner.enabled=false

# Keep tracing/context active without requiring a collector in local deployments.
quarkus.otel.exporter.otlp.enabled=${APP_OTEL_EXPORT_ENABLED:false}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${APP_OTEL_SAMPLE_RATIO:0.1}
quarkus.otel.propagators=tracecontext

# SQL error messages can include duplicate-key values/subjects. Central handlers log safe diagnostics.
quarkus.log.category."org.hibernate.orm.jdbc.error".level=OFF

# Never enable SQL/bind diagnostics by default.
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
