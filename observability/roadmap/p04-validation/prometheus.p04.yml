global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

# INACTIVE candidate. Existing API jobs/limits retained. No rules or retention change.
scrape_configs:
  - job_name: user-api
    metrics_path: /metrics
    sample_limit: 5000
    body_size_limit: 5MB
    label_limit: 16
    label_value_length_limit: 128
    static_configs:
      - targets: ["user-api:8080"]
  - job_name: vocabulary-api
    metrics_path: /q/metrics
    sample_limit: 5000
    body_size_limit: 5MB
    label_limit: 16
    label_value_length_limit: 128
    static_configs:
      - targets: ["vocabulary-api:8080"]
  - job_name: prometheus
    metrics_path: /metrics
    sample_limit: 5000
    body_size_limit: 5MB
    label_limit: 16
    label_value_length_limit: 128
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: fluent-bit
    metrics_path: /api/v1/metrics/prometheus
    sample_limit: 5000
    body_size_limit: 5MB
    label_limit: 16
    label_value_length_limit: 128
    static_configs:
      - targets: ["fluent-bit:2020"]
