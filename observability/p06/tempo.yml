target: all
multitenancy_enabled: false
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
ingester:
  max_block_duration: 5m
  max_block_bytes: 16777216
compactor:
  compaction:
    block_retention: 24h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 16000
      burst_size_bytes: 1048576
      max_traces_per_user: 1000
    global:
      max_bytes_per_trace: 1048576
usage_report:
  reporting_enabled: false
