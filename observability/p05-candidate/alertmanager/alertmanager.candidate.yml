{
  "global": {
    "resolve_timeout": "5m"
  },
  "route": {
    "receiver": "review-only",
    "group_by": [
      "monitoring_project",
      "service",
      "signal"
    ],
    "group_wait": "15s",
    "group_interval": "1m",
    "repeat_interval": "4h",
    "routes": [
      {
        "receiver": "review-only",
        "matchers": [
          "severity=\"critical\""
        ],
        "repeat_interval": "1h"
      }
    ]
  },
  "inhibit_rules": [
    {
      "source_matchers": [
        "severity=\"critical\""
      ],
      "target_matchers": [
        "severity=\"warning\""
      ],
      "equal": [
        "monitoring_project",
        "service",
        "signal"
      ]
    }
  ],
  "receivers": [
    {
      "name": "review-only"
    }
  ]
}
