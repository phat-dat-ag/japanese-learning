cluster.name: japanese-learning-logs
node.name: logs-01
network.host: 0.0.0.0
discovery.type: single-node
bootstrap.memory_lock: false
action.destructive_requires_name: true
plugins.security.ssl.transport.pemcert_filepath: p07/node.pem
plugins.security.ssl.transport.pemkey_filepath: p07/node.key
plugins.security.ssl.transport.pemtrustedcas_filepath: p07/ca.pem
plugins.security.ssl.transport.enforce_hostname_verification: true
plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.pemcert_filepath: p07/node.pem
plugins.security.ssl.http.pemkey_filepath: p07/node.key
plugins.security.ssl.http.pemtrustedcas_filepath: p07/ca.pem
plugins.security.ssl.http.clientauth_mode: OPTIONAL
plugins.security.authcz.admin_dn: ["CN=p07-dev-admin"]
plugins.security.nodes_dn: ["CN=opensearch"]
plugins.security.allow_unsafe_democertificates: false
plugins.security.restapi.roles_enabled: ["all_access", "security_rest_api_access"]
# Absolute headroom on the actual Docker filesystem, not a persistent per-volume quota.
cluster.routing.allocation.disk.watermark.low: 20gb
cluster.routing.allocation.disk.watermark.high: 15gb
cluster.routing.allocation.disk.watermark.flood_stage: 10gb
