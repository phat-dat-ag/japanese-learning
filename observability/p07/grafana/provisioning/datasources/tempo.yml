apiVersion: 1
datasources:
  - name: JP Dev Tempo
    uid: jp-dev-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    orgId: 1
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: jp-dev-prometheus
        tags:
          - key: service.name
            value: job
        queries:
          - name: API request rate
            query: "sum(rate(http_requests_received_total{$__tags}[5m])) or sum(rate(http_server_requests_seconds_count{$__tags}[5m]))"
      nodeGraph:
        enabled: true
