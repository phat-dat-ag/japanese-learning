[SERVICE]
    Flush                     2
    Grace                     30
    Log_Level                 warn
    Parsers_File              /fluent-bit/etc/parsers-app.conf
    storage.path              /state/buffer
    storage.sync              full
    storage.checksum          on
    storage.backlog.mem_limit 32M
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On

[INPUT]
    Name              tail
    Tag               apps.jwks-api
    Path              /logs/jwks/*.log
    Parser            application_json
    DB                /state/jwks.db
    DB.Sync           Full
    Read_from_Head    On
    Refresh_Interval  2
    Rotate_Wait       30
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               apps.user-api
    Path              /logs/user/user-api-*.json
    Parser            application_json
    DB                /state/user.db
    DB.Sync           Full
    Read_from_Head    On
    Refresh_Interval  2
    Rotate_Wait       30
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               apps.vocabulary-api
    Path              /logs/vocabulary/application.json.log
    Parser            application_json
    DB                /state/vocabulary.db
    DB.Sync           Full
    Read_from_Head    On
    Refresh_Interval  2
    Rotate_Wait       30
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name          lua
    Match         apps.*
    script        /fluent-bit/etc/normalize.lua
    call          normalize
    protected_mode On

[OUTPUT]
    Name                     opensearch
    Match                    apps.*
    Host                     opensearch
    Port                     9200
    Suppress_Type_Name       On
    Logstash_Format          On
    Logstash_Prefix          application-logs
    Logstash_Prefix_Key      $index_prefix
    Current_Time_Index       On
    Time_Key                 collected_at
    Generate_ID              On
    Write_Operation          index
    Retry_Limit              False
    storage.total_limit_size ${FLUENT_BIT_STORAGE_LIMIT}
    Trace_Error              Off
