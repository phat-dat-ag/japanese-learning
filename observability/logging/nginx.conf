worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    log_format safe 'status=$status bytes=$body_bytes_sent duration=$request_time';
    access_log /dev/stdout safe;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 10m;
        location = /health { access_log off; return 200 'ok'; }
        location / {
            auth_basic "Application logs";
            auth_basic_user_file /etc/nginx/logs.htpasswd;
            proxy_pass https://opensearch-dashboards:5601;
            proxy_ssl_verify on;
            proxy_ssl_server_name on;
            proxy_ssl_name opensearch-dashboards;
            proxy_ssl_trusted_certificate /run/p07/ca.pem;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
